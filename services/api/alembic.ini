# Yewne 的 Alembic 单数据库迁移配置。

[alembic]
# 迁移脚本目录；%(here)s 表示当前配置文件所在目录。
script_location = %(here)s/alembic

# 把 services/api 加入 Python 导入路径，以便 env.py 导入 app。
prepend_sys_path = .

# 使用当前操作系统的路径分隔符。
path_separator = os

# 数据库地址由 alembic/env.py 从应用的 .env 配置注入，此处不保存密码。
sqlalchemy.url =


[post_write_hooks]
# 暂不配置生成迁移后的自动处理钩子。


# Alembic 命令行日志配置。
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
